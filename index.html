    *{box-sizing:border-box}

    .nature-grain{

      background-image:radial-gradient(rgba(84,106,72,.12) 1px,transparent 1px);
      background-size:18px 18px;
    }
    .hero-shade{
      background:linear-gradient(90deg,rgba(17,55,40,.91) 0%,rgba(29,74,53,.74) 48%,rgba(35,76,50,.2) 100%);

    .leaf-mark{
      width:48px;height:48px;border-radius:17px;
      background:#5e7e4f;color:#fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 22px rgba(44,78,45,.18);
    }
    .planner-shadow{box-shadow:0 20px 55px rgba(55,77,48,.13)}
    .choice-button{
      border:1px solid #ced9c5;background:#fffdf6;color:#45604f;
      transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
    }
    .choice-button:hover,.choice-button:focus-visible{
      transform:translateY(-2px);box-shadow:0 8px 16px rgba(53,84,50,.14);
      outline:3px solid rgba(127,163,89,.34);outline-offset:2px;
    }
    .choice-button.is-active{background:#527849;border-color:#527849;color:#fff}
    .category-button.is-active{background:#a5683e;border-color:#a5683e}
    .action-button,.detail-button,.map-link{
      transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
    }
    .action-button:hover,.detail-button:hover,.map-link:hover,
    .action-button:focus-visible,.detail-button:focus-visible,.map-link:focus-visible{
      transform:translateY(-2px);filter:brightness(1.04);
      box-shadow:0 12px 24px rgba(45,72,42,.21);
      outline:3px solid rgba(119,151,84,.4);outline-offset:3px;
    }
    .result-card{
      box-shadow:0 12px 28px rgba(60,80,50,.12);
      animation:rise .48s ease both;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .result-card:hover{transform:translateY(-4px);box-shadow:0 18px 33px rgba(60,80,50,.17)}
    .result-card:nth-child(2){animation-delay:.07s}
    .result-card:nth-child(3){animation-delay:.14s}
    .result-card:nth-child(4){animation-delay:.21s}
    .result-card:nth-child(5){animation-delay:.28s}
    .result-card[hidden],.trip-modal[hidden]{display:none!important}
    .place-photo{height:12rem;width:100%;object-fit:cover}
    .modal-backdrop{background:rgba(20,47,35,.61);backdrop-filter:blur(7px)}
    .modal-sheet{max-height:calc(88 * min(var(--vh, 1vh), 1vh));animation:modalIn .28s ease both}
    .route-panel{border-left:4px solid #a5683e;background:#fcf1e5}
    .next-panel{border-left:4px solid #6d9359;background:#eff6e8}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const places = [
        {province:"chonburi",provinceName:"ชลบุรี",category:"nature",categoryName:"ธรรมชาติ",name:"เกาะล้าน",description:"เกาะทะเลใกล้พัทยา เหมาะกับการเล่นน้ำ ดำน้ำ และใช้เวลาริมหาดตาแหวนหรือหาดนวล",budget:"ประมาณ 800–1,800 บาท",time:"08:00–17:30 น.",route:"นั่งเรือจากท่าเรือแหลมบาลีฮาย แล้วต่อรถสองแถวหรือมอเตอร์ไซค์บนเกาะ",nextName:"คาเฟ่วิวทะเลบางแสน",nextDescription:"ปิดท้ายวันด้วยกาแฟและวิวทะเลก่อนเดินทางกลับ",map:"https://www.google.com/maps/search/?api=1&query=Koh+Larn+Chonburi",nextMap:"https://www.google.com/maps/search/?api=1&query=Bangsaen+Beach+Cafe"},
        {province:"chonburi",provinceName:"ชลบุรี",category:"culture",categoryName:"วัดและวัฒนธรรม",name:"ปราสาทสัจธรรม พัทยา",description:"สถาปัตยกรรมไม้แกะสลักริมทะเลขนาดใหญ่ เหมาะกับสายศิลปะ วัฒนธรรม และถ่ายภาพ",budget:"ประมาณ 500–1,100 บาท",time:"08:00–18:00 น.",route:"อยู่โซนนาเกลือ พัทยา เดินทางต่อจากชายหาดวงศ์อมาตย์ได้สะดวก",nextName:"ตลาดนาเกลือ",nextDescription:"แวะหาของกินท้องถิ่นและอาหารทะเลในย่านใกล้เคียง",map:"https://www.google.com/maps/search/?api=1&query=Sanctuary+of+Truth+Pattaya",nextMap:"https://www.google.com/maps/search/?api=1&query=Naklua+Market+Pattaya"},
        {province:"rayong",provinceName:"ระยอง",category:"nature",categoryName:"ธรรมชาติ",name:"ทุ่งโปรงทอง",description:"เดินสะพานไม้ชมป่าชายเลนสีทองและวิถีชุมชนปากน้ำประแสในบรรยากาศสบาย ๆ",budget:"ประมาณ 300–800 บาท",time:"07:30–17:00 น.",route:"ขับรถไปโซนปากน้ำประแส แล้วเดินตามเส้นทางศึกษาธรรมชาติ",nextName:"อนุสรณ์เรือรบหลวงประแส",nextDescription:"จุดแวะใกล้กันสำหรับชมเรือรบเก่าและวิวปากแม่น้ำ",map:"https://www.google.com/maps/search/?api=1&query=Tung+Prong+Thong+Rayong",nextMap:"https://www.google.com/maps/search/?api=1&query=HTMS+Prasae+Memorial+Rayong"},
        {province:"rayong",provinceName:"ระยอง",category:"cafe",categoryName:"คาเฟ่",name:"คาเฟ่สวนระยอง",description:"คาเฟ่บรรยากาศสีเขียว เหมาะกับการพักระหว่างทางและนั่งชิลในวันสบาย ๆ",budget:"ประมาณ 180–500 บาท",time:"09:00–17:00 น.",route:"เลือกแวะระหว่างเที่ยวเมืองระยองหรือก่อนมุ่งหน้าไปชายหาดแหลมแม่พิมพ์",nextName:"หาดแหลมแม่พิมพ์",nextDescription:"ไปเดินเล่นริมทะเลและหาอาหารทะเลมื้อเย็นต่อได้",map:"https://www.google.com/maps/search/?api=1&query=Cafe+Rayong",nextMap:"https://www.google.com/maps/search/?api=1&query=Laem+Mae+Phim+Beach+Rayong"},
        {province:"chanthaburi",provinceName:"จันทบุรี",category:"nature",categoryName:"ธรรมชาติ",name:"อุทยานแห่งชาติน้ำตกพลิ้ว",description:"น้ำตกน้ำใสกลางผืนป่า เดินง่าย เหมาะกับการเล่นน้ำคลายร้อนและชมปลาพลวง",budget:"ประมาณ 300–900 บาท",time:"08:00–16:30 น.",route:"ขับจากตัวเมืองจันทบุรีราว 30 นาที ควรเผื่อเวลาเดินชมธรรมชาติ",nextName:"ชุมชนเก่าริมน้ำจันทบูร",nextDescription:"กลับเข้าเมืองเพื่อเดินเล่น ชิมขนม และชมบ้านไม้เก่า",map:"https://www.google.com/maps/search/?api=1&query=Namtok+Phlio+National+Park+Chanthaburi",nextMap:"https://www.google.com/maps/search/?api=1&query=Chanthaboon+Waterfront+Community"},
        {province:"chanthaburi",provinceName:"จันทบุรี",category:"culture",categoryName:"วัดและวัฒนธรรม",name:"ชุมชนเก่าริมน้ำจันทบูร",description:"เดินชมบ้านไม้เก่า ร้านพื้นถิ่น ของฝาก และเรื่องราวเมืองเก่าริมแม่น้ำจันทบุรี",budget:"ประมาณ 300–900 บาท",time:"09:00–18:00 น.",route:"อยู่ในตัวเมือง เดินเที่ยวได้สะดวกและเหมาะกับการจอดรถแล้วเดินเล่น",nextName:"อาสนวิหารพระนางมารีอาปฏิสนธินิรมล",nextDescription:"แวะชมสถาปัตยกรรมเก่าแก่และถ่ายภาพในเมืองจันทบุรี",map:"https://www.google.com/maps/search/?api=1&query=Chanthaboon+Waterfront+Community",nextMap:"https://www.google.com/maps/search/?api=1&query=Cathedral+of+the+Immaculate+Conception+Chanthaburi"},
        {province:"trat",provinceName:"ตราด",category:"nature",categoryName:"ธรรมชาติ",name:"เกาะช้าง",description:"ทริปเกาะครบทั้งชายหาด น้ำตก จุดชมวิว และร้านอาหารทะเล เหมาะกับวันหยุดยาว",budget:"ประมาณ 3,500–7,500 บาท",time:"ทั้งวัน",route:"นั่งเรือเฟอร์รีจากท่าเรืออ่าวธรรมชาติ แล้วใช้รถเช่าหรือรถรับจ้างเที่ยวบนเกาะ",nextName:"น้ำตกคลองพลู",nextDescription:"แวะเล่นน้ำตกกลางเกาะ ก่อนกลับไปชมพระอาทิตย์ตกริมชายหาด",map:"https://www.google.com/maps/search/?api=1&query=Koh+Chang+Trat",nextMap:"https://www.google.com/maps/search/?api=1&query=Klong+Plu+Waterfall+Koh+Chang"},
        {province:"chachoengsao",provinceName:"ฉะเชิงเทรา",category:"culture",categoryName:"วัดและวัฒนธรรม",name:"วัดโสธรวรารามวรวิหาร",description:"สักการะหลวงพ่อโสธร แล้วเที่ยวเมืองแปดริ้วต่อแบบเช้าไปเย็นกลับได้สบาย",budget:"ประมาณ 150–500 บาท",time:"07:00–17:00 น.",route:"อยู่ในตัวเมืองฉะเชิงเทรา เดินทางจากกรุงเทพฯ ได้สะดวกด้วยรถยนต์หรือรถไฟ",nextName:"ตลาดบ้านใหม่ 100 ปี",nextDescription:"แวะชิมอาหารและเดินดูร้านค้าไม้เก่าในบรรยากาศตลาดชุมชน",map:"https://www.google.com/maps/search/?api=1&query=Wat+Sothon+Wararam+Worawihan",nextMap:"https://www.google.com/maps/search/?api=1&query=Ban+Mai+100+Year+Market+Chachoengsao"},
        {province:"prachinburi",provinceName:"ปราจีนบุรี",category:"nature",categoryName:"ธรรมชาติ",name:"แก่งหินเพิง",description:"กิจกรรมล่องแก่งสำหรับสายแอดเวนเจอร์ เหมาะในฤดูฝนถึงต้นหนาว",budget:"ประมาณ 900–2,000 บาท",time:"08:00–16:00 น.",route:"ควรจองกิจกรรมล่วงหน้าและเดินทางด้วยรถยนต์เพื่อความสะดวก",nextName:"น้ำตกเขาอีโต้",nextDescription:"แวะพักชมธรรมชาติและเล่นน้ำเบา ๆ หลังจบกิจกรรม",map:"https://www.google.com/maps/search/?api=1&query=Kaeng+Hin+Phoeng+Prachinburi",nextMap:"https://www.google.com/maps/search/?api=1&query=Khao+Ito+Waterfall+Prachinburi"},
        {province:"sakaeo",provinceName:"สระแก้ว",category:"culture",categoryName:"วัดและวัฒนธรรม",name:"ปราสาทสด๊กก๊อกธม",description:"โบราณสถานขอมขนาดใหญ่ เรียนรู้เรื่องราวอารยธรรมโบราณและถ่ายภาพสถาปัตยกรรมหิน",budget:"ประมาณ 300–900 บาท",time:"08:00–16:30 น.",route:"อยู่ในอำเภอโคกสูง ควรเดินทางด้วยรถยนต์และเผื่อเวลาสำหรับเดินชมโบราณสถาน",nextName:"ตลาดโรงเกลือ",nextDescription:"แวะเดินเลือกซื้อสินค้าและของฝากก่อนเดินทางกลับ",map:"https://www.google.com/maps/search/?api=1&query=Sdok+Kok+Thom+Castle+Sa+Kaeo",nextMap:"https://www.google.com/maps/search/?api=1&query=Rong+Kluea+Market+Sa+Kaeo"}
      ];

      let currentResults = [];
      const selectedCategories = new Set(["cafe","nature","culture"]);
      const cards = Array.from(document.querySelectorAll(".result-card"));
      const emptyState = document.getElementById("results-empty");
      const resultSummary = document.getElementById("result-summary");
      const provinceSelect = document.getElementById("province-select");
      const modal = document.getElementById("trip-modal");
      const closeModalButton = document.getElementById("modal-close");
      const copyLinkButton = document.getElementById("modal-copy-link");
      const copyStatus = document.getElementById("copy-status");

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function openModal(place) {
        document.getElementById("modal-province").textContent = place.provinceName + " • " + place.categoryName;
        document.getElementById("modal-place-name").textContent = place.name;
        document.getElementById("modal-description").textContent = place.description;
        document.getElementById("modal-budget").textContent = place.budget;
        document.getElementById("modal-time").textContent = place.time;
        document.getElementById("modal-route").textContent = place.route;
        document.getElementById("modal-next-name").textContent = place.nextName;
        document.getElementById("modal-next-description").textContent = place.nextDescription;
        document.getElementById("modal-map-link").href = place.map;
        document.getElementById("modal-next-map-link").href = place.nextMap;
        copyStatus.textContent = "";
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        closeModalButton.focus();
      }

      function closeModal() {
        modal.hidden = true;
        document.body.style.overflow = "";
      }

      function renderResults(results) {
        currentResults = results;
        cards.forEach(function(card, index) {
          const place = results[index];
          card.hidden = !place;
          if (!place) return;
          card.querySelector(".result-province").textContent = place.provinceName;
          card.querySelector(".result-category").textContent = place.categoryName;
          card.querySelector(".result-name").textContent = place.name;
          card.querySelector(".result-description").textContent = place.description;
          card.querySelector(".result-budget").textContent = place.budget;
          card.querySelector("button").dataset.resultIndex = String(index);
        });
        emptyState.hidden = results.length > 0;
        resultSummary.textContent = "ได้ " + results.length + " ตัวเลือกที่เข้ากับจังหวัดและหมวดที่เลือก กดการ์ดเพื่อดูเส้นทางและจุดแวะต่อ";
      }

      function pickPlaces() {
        const matches = places.filter(function(place) {
          return (provinceSelect.value === "all" || place.province === provinceSelect.value) && selectedCategories.has(place.category);
        });

        if (!matches.length) {
          cards.forEach(function(card) { card.hidden = true; });
          emptyState.hidden = false;
          resultSummary.textContent = "ลองเลือกอย่างน้อย 1 หมวด เพื่อให้เราสุ่มจุดหมายที่ตรงกับทริปของคุณ";
          return;
        }

        const categoryOrder = ["cafe", "nature", "culture"];
        const groupedResults = categoryOrder.flatMap(function(category) {
          return shuffle(matches.filter(function(place) { return place.category === category; }));
        });
        renderResults(groupedResults.slice(0, Math.min(5, groupedResults.length)));
        document.getElementById("results-section").scrollIntoView({ behavior:"smooth", block:"start" });
      }

      document.querySelectorAll("[data-days]").forEach(function(button) {
        button.addEventListener("click", function() {
          document.querySelectorAll("[data-days]").forEach(function(item) {
            const active = item === button;
            item.classList.toggle("is-active", active);
            item.setAttribute("aria-pressed", String(active));
          });
        });
      });

      document.querySelectorAll("[data-category]").forEach(function(button) {
        button.addEventListener("click", function() {
          const category = button.dataset.category;
          selectedCategories.clear();
          selectedCategories.add(category);

          document.querySelectorAll("[data-category]").forEach(function(item) {
            const active = selectedCategories.has(item.dataset.category);
            item.classList.toggle("is-active", active);
            item.setAttribute("aria-pressed", String(active));
          });
        });
      });

      document.querySelectorAll(".detail-button").forEach(function(button) {
        button.addEventListener("click", function() {
          const place = currentResults[Number(button.dataset.resultIndex)];
          if (place) openModal(place);
        });
      });

      cards.forEach(function(card) {
        card.addEventListener("click", function(event) {
          if (event.target.closest("button")) return;
          const place = currentResults[Number(card.querySelector("button").dataset.resultIndex)];
          if (place) openModal(place);
        });
      });

      document.getElementById("trip-form").addEventListener("submit", function(event) {
        event.preventDefault();
        pickPlaces();
      });

      closeModalButton.addEventListener("click", closeModal);
      modal.addEventListener("click", function(event) {
        if (event.target === modal) closeModal();
      });
      document.addEventListener("keydown", function(event) {
        if (event.key === "Escape" && !modal.hidden) closeModal();
      });

      copyLinkButton.addEventListener("click", async function() {
        try {
          await navigator.clipboard.writeText(document.getElementById("modal-map-link").href);
          copyStatus.textContent = "คัดลอกลิงก์สถานที่แรกแล้ว ส่งให้เพื่อนได้เลย";
        } catch (error) {
          copyStatus.textContent = "คัดลอกไม่สำเร็จ ลองเปิดพิกัดสถานที่แล้วคัดลอกจากเบราว์เซอร์";
        }
      });
    });
  </script>
