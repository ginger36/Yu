  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --primary-glow: rgba(2, 132, 199, 0.15);
      --navy: #0f172a;
      --ink: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.9);
      --accent-yellow: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
    }

    body {
      margin: 0;
      width: 100%;
      font-family: "Prompt", "Plus Jakarta Sans", sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(14, 165, 233, 0.08) 0%, transparent 45%),
        #f8fafc;
      display: flex;
      flex-direction: column;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 3rem 1.5rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(224,242,254,0.4) 100%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      backdrop-filter: blur(10px);
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .12;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(56, 189, 248, 0.05));
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .view {
      display: none;
    }

    .view.active { 
      display: block; 
      animation: fadeInUp .4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(16px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .panel { 
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07), 0 0 1px 1px rgba(15, 23, 42, 0.03); 
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }

    .step-dot {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f1f5f9;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
      transition: all .3s ease;
      border: 2px solid transparent;
    }

    .step-line {
      height: 3px;
      flex: 1;
      margin-top: 17px;
      background: #e2e8f0;
      border-radius: 99px;
      transition: background-color .3s ease;
    }

    .step.active .step-dot {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .step.done .step-dot {
      color: #fff;
      background: var(--primary);
    }

    .step.done + .step-line { 
      background: var(--primary); 
    }

    .choice {
      position: relative;
      min-height: 110px;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: #fff;
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .choice:hover {
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -6px var(--primary-glow);
    }

    .choice.selected {
      border-color: var(--primary);
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
      box-shadow: 0 12px 20px -8px var(--primary-glow);
    }

    .choice .tick {
      opacity: 0;
      transform: scale(.5);
      transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .choice.selected .tick {
      opacity: 1;
      transform: scale(1);
    }

    .place-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .place-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
    }

    .place-card.saved {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 2px var(--accent-yellow), 0 12px 24px -6px rgba(245, 158, 11, 0.2);
    }

    .place-photo {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .result-card { display: none; }
    .result-card.is-match { 
      display: block; 
      animation: fadeInUp .4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }

    button {
      transition: all .2s ease;
    }

    button:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 2px;
    }

    .toast {
      opacity: 0;
      transform: translate(-50%, 20px) scale(0.95);
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }
  </style>

        <img data-template-id="place-koh-chang-image" class="canva-image place-photo" loading="lazy">
        <div class="p-6">
         <p data-template-id="place-koh-chang-province" class="canva-text m-0 text-xs font-bold text-sky-600 uppercase tracking-wider"></p>
         <h4 data-template-id="place-koh-chang-title" class="canva-text mt-1 text-xl font-bold text-slate-900"></h4>
         <p data-template-id="place-koh-chang-description" class="canva-text mt-2.5 text-sm leading-relaxed text-slate-600"></p>
         <span data-template-id="place-koh-chang-tag" class="canva-tag mt-4 inline-block rounded-lg bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600"></span> 
         <button type="button" data-save="koh-chang" class="save-button mt-6 w-full rounded-xl px-4 py-3 text-sm font-semibold transition-all"> 
          <span data-template-id="save-koh-chang" class="canva-text save-default"></span> 
          <span data-template-id="saved-koh-chang" class="canva-text save-active hidden"></span> 
         </button>
        </div>
       </article>
      </div>

      <div id="empty-results" class="hidden mt-8 rounded-2xl border border-dashed border-slate-300 bg-slate-50/50 p-10 text-center">
       <p data-template-id="empty-text" class="canva-text m-0 font-medium text-slate-600"></p>
      </div>
     </section>

     <!-- Bottom Navigation Buttons -->
     <div class="mt-10 flex items-center justify-between gap-4 border-t border-slate-100 pt-6">
      <button id="back-button" data-template-id="back-button" class="canva-button invisible rounded-xl border border-slate-200 bg-white px-5 py-2.5 font-semibold text-slate-700 hover:bg-slate-50 hover:text-slate-900 active:scale-95" type="button"></button> 
      <button id="next-button" data-template-id="next-button" class="canva-button ml-auto rounded-xl bg-sky-600 px-6 py-2.5 font-semibold text-white shadow-lg shadow-sky-500/20 hover:bg-sky-700 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none" type="button" disabled></button> 
      <button id="restart-button" data-template-id="restart-button" class="canva-button hidden ml-auto rounded-xl bg-sky-600 px-6 py-2.5 font-semibold text-white shadow-lg shadow-sky-500/20 hover:bg-sky-700 active:scale-95" type="button"></button>
     </div>
    </section>
   </main>

   <footer class="mx-auto w-full max-w-5xl px-4 pb-8 text-right md:px-8">
    <div class="inline-flex items-center rounded-xl border border-slate-200/80 bg-white/80 px-4 py-2.5 text-sm shadow-sm backdrop-blur-md">
     <span data-template-id="saved-label" class="canva-text font-medium text-slate-600"></span> 
     <span id="saved-count" class="ml-2 rounded-full bg-sky-100 px-2.5 py-0.5 text-xs font-bold text-sky-700" aria-live="polite">0</span>
    </div>
   </footer>

   <!-- Toast Notification -->
   <div id="toast" class="toast fixed bottom-6 left-1/2 z-50 flex items-center gap-2 rounded-2xl bg-slate-900/90 px-6 py-3.5 text-sm font-medium text-white shadow-2xl backdrop-blur-md border border-slate-700/50" aria-live="polite"></div>
  </div>

  <script>
    const state = {
      step: 1,
      province: "",
      type: "",
      saved: new Set()
    };

    const planner = document.getElementById("planner-panel");
    const nextButton = document.getElementById("next-button");
    const backButton = document.getElementById("back-button");
    const restartButton = document.getElementById("restart-button");

    function canAdvance() {
      return state.step === 1 ? Boolean(state.province) : state.step === 2 ? Boolean(state.type) : true;
    }

    function notify(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2100);
    }

    function showPlanner() {
      document.getElementById("welcome-view").classList.remove("active");
      planner.classList.remove("hidden");
      updatePlanner();
      planner.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderResults() {
      let matchCount = 0;

      document.querySelectorAll(".result-card").forEach((card) => {
        const matched = card.dataset.province === state.province && card.dataset.type === state.type;
        card.classList.toggle("is-match", matched);
        if (matched) matchCount += 1;
      });

      document.getElementById("summary").textContent = state.province + " · " + state.type;
      document.getElementById("empty-results").classList.toggle("hidden", matchCount > 0);
    }

    function updatePlanner() {
      ["province", "style", "result"].forEach((name, index) => {
        document.getElementById("view-" + name).classList.toggle("active", state.step === index + 1);
      });

      document.querySelectorAll("[data-indicator]").forEach((indicator) => {
        const number = Number(indicator.dataset.indicator);
        indicator.classList.toggle("active", number === state.step);
        indicator.classList.toggle("done", number < state.step);
      });

      document.getElementById("step-count").textContent = state.step + " / 3";
      backButton.classList.toggle("invisible", state.step === 1);
      nextButton.classList.toggle("hidden", state.step === 3);
      restartButton.classList.toggle("hidden", state.step !== 3);
      nextButton.disabled = !canAdvance();

      if (state.step === 3) renderResults();
    }

    function updateSaveButton(button, isSaved) {
      button.classList.toggle("bg-sky-600", !isSaved);
      button.classList.toggle("text-white", !isSaved);
      button.classList.toggle("hover:bg-sky-700", !isSaved);
      button.classList.toggle("bg-amber-100", isSaved);
      button.classList.toggle("text-amber-800", isSaved);
      button.classList.toggle("hover:bg-amber-200", isSaved);
      button.querySelector(".save-default").classList.toggle("hidden", isSaved);
      button.querySelector(".save-active").classList.toggle("hidden", !isSaved);
    }

    document.getElementById("start-button").addEventListener("click", showPlanner);

    document.querySelectorAll("[data-group]").forEach((button) => {
      button.addEventListener("click", () => {
        const group = button.dataset.group;
        state[group] = button.dataset.value;

        document.querySelectorAll('[data-group="' + group + '"]').forEach((item) => {
          const selected = item === button;
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-pressed", String(selected));
        });

        nextButton.disabled = !canAdvance();
      });
    });

    document.querySelectorAll(".save-button").forEach((button) => {
      button.classList.add("bg-sky-600", "text-white");

      button.addEventListener("click", () => {
        const placeId = button.dataset.save;
        const card = button.closest(".place-card");
        const isSaved = !state.saved.has(placeId);

        if (isSaved) {
          state.saved.add(placeId);
          card.classList.add("saved");
          notify("📌 บันทึกสถานที่ไว้แล้ว");
        } else {
          state.saved.delete(placeId);
          card.classList.remove("saved");
          notify("นำสถานที่ออกจากรายการแล้ว");
        }

        updateSaveButton(button, isSaved);
        document.getElementById("saved-count").textContent = state.saved.size;
      });
    });

    nextButton.addEventListener("click", () => {
      if (!canAdvance()) return;
      state.step += 1;
      updatePlanner();
    });

    backButton.addEventListener("click", () => {
      if (state.step > 1) {
        state.step -= 1;
        updatePlanner();
      }
    });

    restartButton.addEventListener("click", () => {
      state.step = 1;
      state.province = "";
      state.type = "";

      document.querySelectorAll("[data-group]").forEach((item) => {
        item.classList.remove("selected");
        item.setAttribute("aria-pressed", "false");
      });

      planner.classList.add("hidden");
      document.getElementById("welcome-view").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      notify("🔄 เริ่มจัดทริปใหม่แล้ว");
    });

    lucide.createIcons();
  </script>
 </body>
</html>
