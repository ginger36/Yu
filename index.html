<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบวางแผนเที่ยวภาคตะวันออก - 4 หน้า ผลลัพธ์ไม่ซ้ำ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --primary-light: #E0F2FE;
      --bg-blue: #F0F9FF;
      --card-border: #BAE6FD;
      --text-dark: #0C4A6E;
      --text-muted: #475569;
      --white: #FFFFFF;
      --shadow: 0 4px 15px rgba(2, 132, 199, 0.08);
      --shadow-hover: 0 8px 20px rgba(2, 132, 199, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg-blue); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: var(--white);
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
    }
    header h1 { font-family: 'Kanit', sans-serif; font-size: 2rem; margin-bottom: 6px; }

    .container { max-width: 1100px; margin: 25px auto; padding: 0 20px; width: 100%; flex: 1; }

    /* Search Card */
    .search-card {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--card-border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 25px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-weight: 600; color: var(--primary-dark); font-size: 0.95rem; }
    .form-group select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1.5px solid #7DD3FC; background: #F8FAFC; outline: none;
      font-size: 0.95rem; color: var(--text-dark); cursor: pointer;
    }

    .btn-search {
      background: var(--primary); color: var(--white); border: none;
      padding: 12px 20px; border-radius: 10px; font-family: 'Kanit', sans-serif;
      font-size: 1rem; font-weight: 500; cursor: pointer; height: 44px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); transition: all 0.2s;
    }
    .btn-search:hover { background: var(--primary-dark); }

    /* Results Header & Navigation */
    .results-header {
      background: var(--white);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .results-title { font-family: 'Kanit', sans-serif; font-size: 1.2rem; color: var(--primary-dark); }

    /* Page Switcher Tabs (4 หน้า) */
    .page-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--bg-blue);
      border: 1px solid var(--card-border);
      color: var(--primary-dark);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    /* Grid Layout for Places */
    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .place-card {
      background: var(--white);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .place-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

    .place-number {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .place-title {
      font-family: 'Kanit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 6px;
      padding-right: 30px;
    }

    .place-tag {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .place-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 14px;
      flex: 1;
    }

    .btn-pin {
      background: var(--bg-blue);
      border: 1px solid var(--card-border);
      color: var(--primary-dark);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-pin.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

    footer {
      background: var(--white);
      border-top: 1px solid var(--card-border);
      text-align: center;
      padding: 18px;
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>🗺️ ระบบจัดทริปภาคตะวันออก 7 จังหวัด</h1>
    <p>แสดงรายการสถานที่ท่องเที่ยว 4 หน้า หน้าละ 10 แห่ง แบบไม่ซ้ำกัน</p>
  </header>

  <div class="container">
    
    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="search-card">
      <div class="form-group">
        <label for="province">📍 เลือกจังหวัด:</label>
        <select id="province">
          <option value="ชลบุรี">ชลบุรี</option>
          <option value="ระยอง">ระยอง</option>
          <option value="จันทบุรี">จันทบุรี</option>
          <option value="ตราด">ตราด</option>
          <option value="ฉะเชิงเทรา">ฉะเชิงเทรา</option>
          <option value="ปราจีนบุรี">ปราจีนบุรี</option>
          <option value="สระแก้ว">สระแก้ว</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">🏖️ เลือกหมวดหมู่สถานที่:</label>
        <select id="category">
          <option value="nature">🌿 ธรรมชาติและทะเล</option>
          <option value="cafe">☕ คาเฟ่และร้านกาแฟ</option>
          <option value="culture">🛕 วัดและวัฒนธรรม</option>
        </select>
      </div>

      <button class="btn-search" onclick="startSearch()">🔍 ค้นหาข้อมูลทริป</button>
    </div>

    <!-- แถบแสดงหน้าผลลัพธ์ (4 หน้า) -->
    <div class="results-header" id="results-bar" style="display: none;">
      <div class="results-title" id="results-title-text">รายการสถานที่ท่องเที่ยว</div>
      
      <div class="page-tabs">
        <button class="tab-btn active" id="tab-1" onclick="switchResultPage(1)">หน้า 1 (1-10)</button>
        <button class="tab-btn" id="tab-2" onclick="switchResultPage(2)">หน้า 2 (11-20)</button>
        <button class="tab-btn" id="tab-3" onclick="switchResultPage(3)">หน้า 3 (21-30)</button>
        <button class="tab-btn" id="tab-4" onclick="switchResultPage(4)">หน้า 4 (31-40)</button>
      </div>
    </div>

    <!-- ตารางแสดงสถานที่ (แสดงครั้งละ 10 แห่ง) -->
    <div class="places-grid" id="places-container">
      <!-- ข้อมูลจะถูกโหลดเข้ามาตรงนี้ -->
    </div>

  </div>

  <footer>
    © 2026 ระบบท่องเที่ยวภาคตะวันออก | แสดงผล 4 หน้า หน้าละ 10 สถานที่โดยไม่มีรายการซ้ำ
  </footer>

  <script>
    // -------------------------------------------------------------
    // DATABASE: ข้อมูลครบทั้ง 7 จังหวัด x 3 หมวดหมู่ (หมวดละ 40 สถานที่ ไม่ซ้ำ)
    // -------------------------------------------------------------
    const categoryLabels = {
      nature: "ธรรมชาติและทะเล",
      cafe: "คาเฟ่และร้านกาแฟ",
      culture: "วัดและวัฒนธรรม"
    };

    // ตัวอย่างฐานข้อมูลรายการสถานที่ 40 แห่งแบบไม่ซ้ำต่อหมวด
    const database = {};

    const provinces = ["ชลบุรี", "ระยอง", "จันทบุรี", "ตราด", "ฉะเชิงเทรา", "ปราจีนบุรี", "สระแก้ว"];
    const categories = ["nature", "cafe", "culture"];

    // ฟังก์ชันจำลองการเจนสถานที่ให้ครบหมวดละ 40 แห่งไม่ซ้ำกันสำหรับทดสอบระบบ
    provinces.forEach(prov => {
      database[prov] = {};
      categories.forEach(cat => {
        database[prov][cat] = [];
        let prefix = "";
        if (cat === "nature") prefix = "จุดท่องเที่ยวธรรมชาติ/ทะเล ";
        if (cat === "cafe") prefix = "คาเฟ่บรรยากาศดี ";
        if (cat === "culture") prefix = "วัด/แหล่งวัฒนธรรม ";

        for (let i = 1; i <= 40; i++) {
          database[prov][cat].push({
            id: `${prov}-${cat}-${i}`,
            name: `${prefix}${prov} แห่งที่ ${i}`,
            desc: `สถานที่ท่องเที่ยวในหมวด${categoryLabels[cat]} ของจังหวัด${prov} ลำดับที่ ${i} เหมาะสำหรับแวะพักผ่อนถ่ายรูป`
          });
        }
      });
    });

    // ตัวแปรควบคุมหน้า
    let currentSearchResults = [];
    let currentPage = 1;
    let pinnedItems = JSON.parse(localStorage.getItem('my_pinned_places') || '[]');

    function startSearch() {
      const province = document.getElementById('province').value;
      const category = document.getElementById('category').value;

      // ดึงข้อมูล 40 รายการตรงตามจังหวัดและหมวดหมู่
      currentSearchResults = database[province][category];
      currentPage = 1;

      // แสดงแถบสลับหน้า
      document.getElementById('results-bar').style.display = 'flex';
      document.getElementById('results-title-text').textContent = `${categoryLabels[category]} จ.${province} (รวม 40 แห่ง)`;

      renderPage(1);
    }

    function switchResultPage(pageNumber) {
      currentPage = pageNumber;
      
      // อัปเดตสถานะปุ่ม Tab
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${pageNumber}`).classList.add('active');

      renderPage(pageNumber);
    }

    function renderPage(pageNumber) {
      const container = document.getElementById('places-container');
      container.innerHTML = '';

      // คำนวณช่วงข้อมูล (หน้าละ 10 รายการ)
      // หน้า 1: 0-9 | หน้า 2: 10-19 | หน้า 3: 20-29 | หน้า 4: 30-39
      const startIndex = (pageNumber - 1) * 10;
      const pageItems = currentSearchResults.slice(startIndex, startIndex + 10);

      pageItems.forEach((item, index) => {
        const itemNumber = startIndex + index + 1;
        const isPinned = pinnedItems.includes(item.id);

        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <span class="place-number">#${itemNumber}</span>
          <div class="place-title">${item.name}</div>
          <div class="place-tag">📍 ${document.getElementById('province').value}</div>
          <div class="place-desc">${item.desc}</div>
          <button class="btn-pin ${isPinned ? 'active' : ''}" onclick="togglePin('${item.id}')">
            ${isPinned ? '📌 ปักหมุดแล้ว' : '📌 ปักหมุดสถานที่'}
          </button>
        `;
        container.appendChild(card);
      });

      window.scrollTo({ top: 220, behavior: 'smooth' });
    }

    function togglePin(id) {
      if (pinnedItems.includes(id)) {
        pinnedItems = pinnedItems.filter(item => item !== id);
      } else {
        pinnedItems.push(id);
      }
      localStorage.setItem('my_pinned_places', JSON.stringify(pinnedItems));
      renderPage(currentPage);
    }

    // เริ่มต้นค้นหาทันทีเมื่อโหลดหน้าเว็บ
    window.onload = function() {
      startSearch();
    };
  </script>
</body>
</html>
