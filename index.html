<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Trip Box - สุ่มทริปเที่ยวภาคตะวันออก</title>
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-cream: #FBF9F1;
      --soft-blue: #E5E1DA;
      --pastel-blue: #89CFF0;
      --sky-blue: #0284C7;
      --deep-navy: #1E293B;
      --accent-yellow: #FDE047;
      --card-bg: #FFFFFF;
      --text-main: #334155;
      --text-sub: #64748B;
      --radius-xl: 28px;
      --radius-lg: 18px;
      --shadow-soft: 0 10px 30px rgba(137, 207, 240, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: #E2E8F0;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Mobile Container Frame */
    .mobile-wrapper {
      width: 100%;
      max-width: 414px;
      height: 870px;
      max-height: 94vh;
      background: var(--bg-cream);
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 12px #334155;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch & Bar */
    .notch-bar {
      width: 100%;
      height: 30px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 8px;
      z-index: 100;
    }
    .notch {
      width: 120px;
      height: 18px;
      background: #334155;
      border-radius: 20px;
    }

    .app-header {
      padding: 12px 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #F1F5F9;
    }
    .app-title {
      font-family: 'Kanit', sans-serif;
      font-size: 1.4rem;
      color: var(--sky-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Scrollable Main Content */
    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }

    .content-container::-webkit-scrollbar {
      display: none;
    }

    /* Section Cards */
    .section-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      border: 2px solid #F1F5F9;
    }

    .section-title {
      font-family: 'Kanit', sans-serif;
      font-size: 1.05rem;
      color: var(--deep-navy);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Filter Grid Buttons */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .filter-btn {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-btn.selected {
      background: #E0F2FE;
      border-color: var(--sky-blue);
      color: var(--sky-blue);
      font-weight: 600;
    }

    /* Random Action Button */
    .btn-random {
      width: 100%;
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-family: 'Kanit', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      margin-top: 8px;
    }
    .btn-random:active {
      transform: scale(0.97);
    }

    /* Result Card Display */
    .result-box {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      border: 2px solid #E0F2FE;
      animation: popIn 0.4s ease;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-img-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
    }
    .result-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .result-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sky-blue);
    }

    .result-details {
      padding: 18px;
    }
    .place-name {
      font-family: 'Kanit', sans-serif;
      font-size: 1.3rem;
      color: var(--deep-navy);
      margin-bottom: 4px;
    }
    .place-province {
      font-size: 0.85rem;
      color: var(--sky-blue);
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .place-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* Budget Estimator Table */
    .budget-card {
      background: #F0F9FF;
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-top: 12px;
    }
    .budget-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--deep-navy);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .budget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }
    .budget-item {
      background: white;
      padding: 8px 4px;
      border-radius: 12px;
      border: 1px solid #BAE6FD;
    }
    .budget-day {
      font-size: 0.7rem;
      color: var(--text-sub);
    }
    .budget-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--sky-blue);
    }

    /* Hotel Zone Recommendation */
    .hotel-zone {
      margin-top: 12px;
      padding: 10px 12px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: var(--radius-lg);
      font-size: 0.8rem;
      color: #92400E;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      height: 60px;
      background: white;
      border-top: 1px solid #F1F5F9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-sub);
      text-decoration: none;
    }
    .nav-item.active {
      color: var(--sky-blue);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Mobile Frame Container -->
  <div class="mobile-wrapper">
    <!-- Notch -->
    <div class="notch-bar"><div class="notch"></div></div>

    <!-- App Header -->
    <header class="app-header">
      <div class="app-title">
        <i data-lucide="compass"></i> East Trip Box
      </div>
    </header>

    <!-- Scrollable Content -->
    <div class="content-container">

      <!-- Step 1: Select Type -->
      <div class="section-card">
        <div class="section-title">
          <i data-lucide="sparkles" style="color:#0284C7;"></i> เลือกสไตล์ที่ชอบ
        </div>
        <div class="filter-grid" id="type-filters">
          <button class="filter-btn selected" data-value="all"><i data-lucide="grid"></i> ทั้งหมด</button>
          <button class="filter-btn" data-value="cafe"><i data-lucide="coffee"></i> คาเฟ่ชิลๆ</button>
          <button class="filter-btn" data-value="sea"><i data-lucide="waves"></i> ทะเล & เกาะ</button>
          <button class="filter-btn" data-value="nature"><i data-lucide="trees"></i> ภูเขา & น้ำตก</button>
          <button class="filter-btn" data-value="culture"><i data-lucide="landmark"></i> โบราณ & วัด</button>
        </div>
      </div>

      <!-- Step 2: Select Province -->
      <div class="section-card">
        <div class="section-title">
          <i data-lucide="map-pin" style="color:#0284C7;"></i> จังหวัดภาคตะวันออก
        </div>
        <div class="filter-grid" id="province-filters">
          <button class="filter-btn selected" data-province="all">ทุกจังหวัด</button>
          <button class="filter-btn" data-province="ชลบุรี">ชลบุรี</button>
          <button class="filter-btn" data-province="ระยอง">ระยอง</button>
          <button class="filter-btn" data-province="จันทบุรี">จันทบุรี</button>
          <button class="filter-btn" data-province="ตราด">ตราด</button>
          <button class="filter-btn" data-province="ฉะเชิงเทรา">ฉะเชิงเทรา</button>
          <button class="filter-btn" data-province="นครนายก">นครนายก</button>
          <button class="filter-btn" data-province="ปราจีนบุรี">ปราจีนบุรี</button>
        </div>
      </div>

      <!-- Random Action Button -->
      <button class="btn-random" id="btn-spin">
        <i data-lucide="dices"></i> กดสุ่มที่เที่ยวกันเลย!
      </button>

      <!-- Result Card Display -->
      <div style="margin-top: 16px;">
        <div class="result-box" id="result-box">
          <div class="result-img-wrapper">
            <img src="" id="res-img" class="result-img" alt="ภาพสถานที่จริง">
            <span class="result-badge" id="res-cat">หมวดหมู่</span>
          </div>

          <div class="result-details">
            <div class="place-name" id="res-title">ชื่อสถานที่</div>
            <div class="place-province"><i data-lucide="map-pin" style="width: 14px;"></i> <span id="res-prov">จังหวัด</span></div>
            <p class="place-desc" id="res-desc">รายละเอียดสถานที่บรรยายความสวยงามและไฮไลต์สำคัญ...</p>

            <!-- Budget Info -->
            <div class="budget-card">
              <div class="budget-title"><i data-lucide="wallet" style="width: 16px; color:#0284C7;"></i> ค่าใช้จ่ายคร่าวๆ (ต่อคน)</div>
              <div class="budget-grid">
                <div class="budget-item">
                  <div class="budget-day">1 วัน (เช้า-เย็น)</div>
                  <div class="budget-price" id="b-1d">฿500</div>
                </div>
                <div class="budget-item">
                  <div class="budget-day">2 วัน 1 คืน</div>
                  <div class="budget-price" id="b-2d">฿1,800</div>
                </div>
                <div class="budget-item">
                  <div class="budget-day">3 วัน 2 คืน</div>
                  <div class="budget-price" id="b-3d">฿3,200</div>
                </div>
              </div>
            </div>

            <!-- Accommodation Zone Info -->
            <div class="hotel-zone">
              <strong><i data-lucide="bed" style="width:14px; vertical-align:middle;"></i> โซนที่พักแนะนำ:</strong>
              <span id="res-hotel">แนะนำที่พักบริเวณใกล้เคียง</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active"><i data-lucide="dices"></i> สุ่มทริป</a>
      <a href="#" class="nav-item"><i data-lucide="heart"></i> บันทึก</a>
      <a href="#" class="nav-item"><i data-lucide="user"></i> โปรไฟล์</a>
    </nav>
  </div>

      {

        category: "nature",
        catLabel: "ภูเขา & น้ำตก",
        img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop",
        desc: "อุทยานแห่งชาติริมทะเล มีทุ่งหญ้าสีทอง เส้นทางเดินศึกษาธรรมชาติ และสะพานเทียบเรือสุดโรแมนติกมุมถ่ายรูปเพียบ",

        b1: "฿800", b2: "฿2,300", b3: "฿4,000",
        hotel: "โฮสเทลเรือนไม้โบราณในชุมชนจันทบูร"
      },
      {
        title: "ตึกอภัยภูเบศร & อุทยานทับลาน",
        province: "ปราจีนบุรี",
        category: "culture",
        catLabel: "โบราณ & วัด",
        img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600&auto=format&fit=crop",
        desc: "ชมตึกสถาปัตยกรรมยุโรปสีเหลืองสดใส เรียนรู้สมุนไพรไทย และเดินทางไปสูดอากาศบริสุทธิ์ที่อุทยานแห่งชาติทับลาน",
        b1: "฿500", b2: "฿1,700", b3: "฿3,000",
        hotel: "โรงแรมและรีสอร์ตในตัวเมืองปราจีนบุรี หรือ โซนนาดี"
      }
    ];

    // Selected Filters State
    let selectedType = 'all';
    let selectedProvince = 'all';

    // Filter Click Handlers
    document.querySelectorAll('#type-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#type-filters .filter-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedType = btn.dataset.value;
      });
    });

    document.querySelectorAll('#province-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#province-filters .filter-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedProvince = btn.dataset.province;
      });
    });

    // Random Spin Action
    const spinBtn = document.getElementById('btn-spin');
    const resultBox = document.getElementById('result-box');

    spinBtn.addEventListener('click', () => {
      // Filter Places
      let filtered = places.filter(p => {
        const matchType = (selectedType === 'all' || p.category === selectedType);
        const matchProv = (selectedProvince === 'all' || p.province === selectedProvince);
        return matchType && matchProv;
      });

      if (filtered.length === 0) {
        alert('ไม่พบสถานที่ในตัวเลือกนี้ ลองเลือกจังหวัดหรือหมวดไม้อื่นดูน้า!');
        return;
      }

      // Spin Effect Animation
      spinBtn.style.transform = "scale(0.95)";
      setTimeout(() => spinBtn.style.transform = "scale(1)", 150);

      // Pick Random
      const randomPlace = filtered[Math.floor(Math.random() * filtered.length)];

      // Populate UI
      document.getElementById('res-img').src = randomPlace.img;
      document.getElementById('res-cat').textContent = randomPlace.catLabel;
      document.getElementById('res-title').textContent = randomPlace.title;
      document.getElementById('res-prov').textContent = randomPlace.province;
      document.getElementById('res-desc').textContent = randomPlace.desc;
      document.getElementById('b-1d').textContent = randomPlace.b1;
      document.getElementById('b-2d').textContent = randomPlace.b2;
      document.getElementById('b-3d').textContent = randomPlace.b3;
      document.getElementById('res-hotel').textContent = randomPlace.hotel;

      // Show Result
      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
