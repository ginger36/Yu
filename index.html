<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Trip Box - สุ่ม & สำรวจทริปภาคตะวันออก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --primary-blue: #0284c7;
      --soft-sky: #e0f2fe;
      --accent-yellow: #fef08a;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
      --danger-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      color: var(--text-main);
    }

    /* กรอบหน้าจอมือถือ */
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 840px;
      background: var(--bg-color);
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 0 0 0 10px #1e293b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* แถบหัวเรื่องด้านบน */
    .header {
      background: #ffffff;
      padding: 16px;
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
    }

    .header h1 {
      font-family: 'Kanit', sans-serif;
      font-size: 1.3rem;
      color: var(--primary-blue);
    }

    /* ปุ่มย้อนกลับ */
    .btn-back {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--soft-sky);
      color: var(--primary-blue);
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
    }

    /* ส่วนเนื้อหาของแต่ละหน้า */
    .content-page {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none; /* ซ่อนหน้าไว้ก่อน */
    }

    .content-page.active {
      display: block; /* แสดงหน้าที่เลือก */
    }

    /* การ์ดเมนูตัวเลือก */
    .section-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      border: 2px solid var(--border-color);
    }

    .section-title {
      font-family: 'Kanit', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* ปุ่มกริดหมวดหมู่ / จังหวัด */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn-option {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .btn-option.active {
      background: var(--soft-sky);
      border-color: var(--primary-blue);
      color: var(--primary-blue);
      font-weight: 600;
    }

    /* ปุ่มกดแอ็กชันหลัก */
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
      margin-bottom: 10px;
    }

    /* การ์ดรายการสถานที่ (List Item) */
    .place-item-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 2px solid #e2e8f0;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .place-item-card:active {
      transform: scale(0.98);
    }

    .place-item-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
    }

    .place-item-info {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .place-item-title {
      font-family: 'Kanit', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
    }

    .place-item-sub {
      font-size: 0.75rem;
      color: var(--primary-blue);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .rating-stars {
      color: #f59e0b;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* หน้ารายละเอียดสถานที่ (Detail Page) */
    .detail-img-box {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
    }

    .detail-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .btn-fav {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--danger-red);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .detail-desc, .detail-travel {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* ตารางค่าใช้จ่าย & ที่พัก */
    .info-box-blue {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .info-box-yellow {
      background: #fefce8;
      border: 1px solid #fef08a;
      border-radius: 14px;
      padding: 10px;
      font-size: 0.8rem;
      color: #854d0e;
    }

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
      margin-top: 6px;
    }

    .budget-item {
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .budget-item span { display: block; font-size: 0.65rem; color: var(--text-sub); }
    .budget-item strong { font-size: 0.8rem; color: var(--primary-blue); }

    /* แถบเมนูด้านล่าง (Bottom Navigation) */
    .bottom-nav {
      height: 62px;
      background: #ffffff;
      border-top: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 500;
    }

    .nav-btn.active {
      color: var(--primary-blue);
      font-weight: 700;
    }

    .nav-btn span { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Header -->
    <div class="header">
      <button class="btn-back" id="btn-back" onclick="goBack()">‹ ย้อนกลับ</button>
      <h1 id="page-title">🧭 East Trip Box</h1>
    </div>

    <!-- 1. หน้าสุ่มทริป (Random Page) -->
    <div class="content-page active" id="page-random">
      <div class="section-card">
        <div class="section-title">✨ 1. เลือกสไตล์การเที่ยว</div>
        <div class="filter-grid" id="rand-type-group">
          <button class="btn-option active" data-type="all">🌈 ทั้งหมด</button>
          <button class="btn-option" data-type="cafe">☕ คาเฟ่ชิลๆ</button>
          <button class="btn-option" data-type="sea">🏖️ ทะเล & เกาะ</button>
          <button class="btn-option" data-type="nature">🌿 ภูเขา & น้ำตก</button>
          <button class="btn-option" data-type="culture">🛕 วัด & โบราณสถาน</button>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">📍 2. เลือกจังหวัดภาคตะวันออก</div>
        <div class="filter-grid" id="rand-prov-group">
          <button class="btn-option active" data-prov="all">ทุกจังหวัด</button>
          <button class="btn-option" data-prov="ชลบุรี">ชลบุรี</button>
          <button class="btn-option" data-prov="ระยอง">ระยอง</button>
          <button class="btn-option" data-prov="จันทบุรี">จันทบุรี</button>
          <button class="btn-option" data-prov="ตราด">ตราด</button>
          <button class="btn-option" data-prov="นครนายก">นครนายก</button>
          <button class="btn-option" data-prov="ฉะเชิงเทรา">ฉะเชิงเทรา</button>
          <button class="btn-option" data-prov="ปราจีนบุรี">ปราจีนบุรี</button>
        </div>
      </div>

      <button class="btn-main" onclick="spinRandom()">🎲 กดสุ่มสถานที่ท่องเที่ยว!</button>
    </div>

    <!-- 2. หน้ารายการค้นหา/สำรวจ (Explore Page) -->
    <div class="content-page" id="page-explore">
      <div class="section-card" style="padding: 10px;">
        <div class="filter-grid" id="exp-prov-group">
          <button class="btn-option active" data-prov="ชลบุรี">ชลบุรี</button>
          <button class="btn-option" data-prov="ระยอง">ระยอง</button>
          <button class="btn-option" data-prov="จันทบุรี">จันทบุรี</button>
          <button class="btn-option" data-prov="นครนายก">นครนายก</button>
        </div>
      </div>
      <div class="section-card" style="padding: 10px;">
        <div class="filter-grid" id="exp-type-group">
          <button class="btn-option active" data-type="all">ทั้งหมด</button>
          <button class="btn-option" data-type="sea">ทะเล/ธรรมชาติ</button>
          <button class="btn-option" data-type="cafe">คาเฟ่</button>
          <button class="btn-option" data-type="culture">วัด/โบราณสถาน</button>
        </div>
      </div>

      <div id="explore-list"></div>
    </div>

    <!-- 3. หน้าแสดงรายละเอียดสถานที่ (Place Detail Page) -->
    <div class="content-page" id="page-detail">
      <div class="detail-img-box">
        <img id="dt-img" src="" alt="รูปสถานที่">
      </div>
      
      <div class="detail-header">
        <div>
          <h2 id="dt-title" style="font-family:'Kanit'; font-size:1.3rem;">ชื่อสถานที่</h2>
          <div id="dt-prov" style="font-size:0.85rem; color:var(--primary-blue); font-weight:600;">📍 จังหวัด</div>
          <div class="rating-stars" id="dt-rating">★ 4.8 / 5.0</div>
        </div>
        <button class="btn-fav" id="btn-toggle-fav" onclick="toggleSaveCurrent()">❤️ บันทึก</button>
      </div>

      <p class="detail-desc" id="dt-desc">รายละเอียดสถานที่...</p>

      <!-- วิธีการเดินทาง -->
      <div class="section-card" style="padding: 12px; margin-bottom: 10px;">
        <div style="font-weight:600; font-size:0.85rem; margin-bottom:4px;">🚗 การเดินทางไป-กลับ:</div>
        <div class="detail-travel" id="dt-travel" style="margin:0;">รายละเอียดการเดินทาง...</div>
      </div>

      <!-- ค่าใช้จ่าย -->
      <div class="info-box-blue">
        <div style="font-weight:600; font-size:0.8rem;">💵 ประมาณการค่าใช้จ่ายคร่าวๆ (ต่อคน)</div>
        <div class="budget-grid">
          <div class="budget-item"><span>1 วัน</span><strong id="dt-b1">฿0</strong></div>
          <div class="budget-item"><span>2 วัน 1 คืน</span><strong id="dt-b2">฿0</strong></div>
          <div class="budget-item"><span>3 วัน 2 คืน</span><strong id="dt-b3">฿0</strong></div>
        </div>
      </div>

      <!-- ที่พัก -->
      <div class="info-box-yellow">
        <strong>🏨 โซนที่พักแนะนำใกล้เคียง:</strong><br>
        <span id="dt-hotel">ที่พักแนะนำ...</span>
      </div>
    </div>

    <!-- 4. หน้าบันทึกสถานที่ (Saved Page) -->
    <div class="content-page" id="page-saved">
      <div id="saved-list"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <button class="nav-btn active" id="nav-rand" onclick="switchPage('page-random', '🧭 สุ่มทริป')">
        <span>🎲</span> สุ่มทริป
      </button>
      <button class="nav-btn" id="nav-exp" onclick="switchPage('page-explore', '🔍 รายการสถานที่')">
        <span>📍</span> สำรวจสถานที่
      </button>
      <button class="nav-btn" id="nav-fav" onclick="switchPage('page-saved', '❤️️ สถานที่บันทึกไว้')">
        <span>⭐</span> บันทึกแล้ว
      </button>
    </div>
  </div>

  <script>
    // ฐานข้อมูลสถานที่ท่องเที่ยวภาคตะวันออก
    const places = [
      {
        id: 1,
        title: "หาดบางแสน & หาดวอนนภา",
        province: "ชลบุรี",
        type: "sea",
        rating: "★ 4.7 / 5.0 (รีวิวแน่น)",
        img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
        desc: "หาดทรายยอดฮิตใกล้กรุงเทพฯ นั่งชิลรับลมทะเล ชมพระอาทิตย์ตกดินริมหาดวอนนภา พร้อมชิมอาหารทะเลสดๆ",
        travel: "เดินทางโดยรถยนต์ส่วนตัวจาก BKK ใช้เวลา 1.5 ชม. ผ่านทางด่วนบูรพาวิถี หรือนั่งรถตู้จากเอกมัยมาลงวงเวียนบางแสน",
        b1: "฿500", b2: "฿1,800", b3: "฿3,200",
        hotel: "โซนหาดวอนนภา หรือ ถนนลงหาดบางแสน มีโรงแรมและโฮสเทลแนวมินิมอลให้เลือกเยอะมาก"
      },
      {
        id: 2,
        title: "น้ำตกชันตาเถร & เขาเขียว",
        province: "ชลบุรี",
        type: "nature",
        rating: "★ 4.6 / 5.0",
        img: "https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=600&q=80",
        desc: "สัมผัสความเขียวขจีกลางป่าชลบุรี น้ำตกสวยบรรยากาศร่มรื่น เหมาะกับการเดินป่าศึกษาธรรมชาติพักผ่อนหย่อนใจ",
        travel: "ขับรถจากตัวเมืองชลบุรีไปทางสวนสัตว์เปิดเขาเขียว ประมาณ 30 นาที มีป้ายบอกทางชัดเจนตลอดเส้นทาง",
        b1: "฿400", b2: "฿1,500", b3: "฿2,800",
        hotel: "รีสอร์ตและลานกางเต็นท์บริเวณรอบเขตรักษาพันธุ์สัตว์ป่าเขาเขียว-เขาชมภู่"
      },
      {
        title: "เกาะเสม็ด (หาดทรายแก้ว)",
        id: 3,
        province: "ระยอง",
        type: "sea",
        rating: "★ 4.8 / 5.0",
        img: "https://images.unsplash.com/photo-1590523741831-ab7e8b8f9c7f?auto=format&fit=crop&w=600&q=80",
        desc: "เกาะสวยน้ำใสปิ่นเกล้าทะเลตะวันออก เดินทางง่าย หาดทรายขาวละเอียด เหมาะทั้งพักผ่อนและปาร์ตี้ริมหาดยามค่ำคืน",
        travel: "ขับรถมาข้ามเรือที่ท่าเรือบ้านเพ (ระยอง) นั่งสปีดโบ๊ท 15 นาที หรือเรือโดยสารไม้ 30 นาทีถึงเกาะ",
        b1: "฿1,200", b2: "฿2,800", b3: "฿4,500",
        hotel: "รีสอร์ตติดชายหาดบริเวณ หาดทรายแก้ว หรือ อ่าววงเดือน"
      },
      {
        id: 4,
        title: "น้ำตกสาริกา & เขื่อนขุนด่าน",
        province: "นครนายก",
        type: "nature",
        rating: "★ 4.9 / 5.0",
        img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80",
        desc: "น้ำตกขนาดใหญ่ 9 ชั้นเล่นน้ำฉ่ำๆ พร้อมขึ้นไปสัมผัสลมเย็นและวิวอลังการบนสันเขื่อนขุนด่านปราการชล",
        travel: "จากกรุงเทพฯ ใช้เส้นทาง รังสิต-นครนายก (สาย 305) มุ่งหน้าสู่อำเภอเมืองนครนายก ประมาณ 2 ชั่วโมง",
        b1: "฿700", b2: "฿2,200", b3: "฿3,800",
        hotel: "รีสอร์ตติดริมน้ำนครนายก หรือ โฮมสเตย์ใกล้น้ำตกสาริกา"
      },
      {
        id: 5,
        title: "ชุมชนริมน้ำจันทบูร",
        province: "จันทบุรี",
        type: "culture",
        rating: "★ 4.7 / 5.0",
        img: "https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?auto=format&fit=crop&w=600&q=80",
        desc: "เดินชมชุมชนเก่าแก่ริมน้ำ ย้อนรอยประวัติศาสตร์ ถ่ายรูปคู่บ้านไม้โบราณ และชิมขนมคาวหวานถิ่นจันทบูร",
        travel: "ตั้งอยู่ใจกลางอำเภอเมืองจันทบุรี ขับรถปักหมุดอาสนวิหารพระนางมารีอามหาการุณย์ แล้วเดินข้ามสะพานมาได้เลย",
        b1: "฿800", b2: "฿2,300", b3: "฿4,000",
        hotel: "บูทีคโฮสเทลและโรงแรมเรือนไม้โบราณในชุมชนริมน้ำ"
      }
    ];

    // รายการ ID ที่บันทึกไว้
    let savedIds = [1];
    let currentPlace = null;
    let pageHistory = [];

    // เปลี่ยนหน้าต่าง
    function switchPage(pageId, title, isBack = false) {
      if (!isBack) {
        const activePage = document.querySelector('.content-page.active');
        if (activePage) pageHistory.push(activePage.id);
      }

      document.querySelectorAll('.content-page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      document.getElementById('page-title').textContent = title;

      // แสดง/ซ่อน ปุ่มย้อนกลับ
      const btnBack = document.getElementById('btn-back');
      if (pageHistory.length > 0 && pageId !== 'page-random') {
        btnBack.style.display = 'block';
      } else {
        btnBack.style.display = 'none';
      }

      // อัปเดตสีปุ่ม Nav
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if(pageId === 'page-random') document.getElementById('nav-rand').classList.add('active');
      if(pageId === 'page-explore') document.getElementById('nav-exp').classList.add('active');
      if(pageId === 'page-saved') document.getElementById('nav-fav').classList.add('active');

      if(pageId === 'page-explore') renderExploreList();
      if(pageId === 'page-saved') renderSavedList();
    }

    // ฟังก์ชันย้อนกลับ
    function goBack() {
      if (pageHistory.length > 0) {
        const lastPage = pageHistory.pop();
        let title = '🧭 East Trip Box';
        if (lastPage === 'page-explore') title = '🔍 รายการสถานที่';
        if (lastPage === 'page-saved') title = '❤️ สถานที่บันทึกไว้';
        switchPage(lastPage, title, true);
      }
    }

    // ดูรายละเอียดสถานที่
    function openDetail(place) {
      currentPlace = place;
      document.getElementById('dt-img').src = place.img;
      document.getElementById('dt-title').textContent = place.title;
      document.getElementById('dt-prov').textContent = '📍 ' + place.province;
      document.getElementById('dt-rating').textContent = place.rating;
      document.getElementById('dt-desc').textContent = place.desc;
      document.getElementById('dt-travel').textContent = place.travel;
      document.getElementById('dt-b1').textContent = place.b1;
      document.getElementById('dt-b2').textContent = place.b2;
      document.getElementById('dt-b3').textContent = place.b3;
      document.getElementById('dt-hotel').textContent = place.hotel;

      updateFavBtn();
      switchPage('page-detail', 'รายละเอียดสถานที่');
    }

    // บันทึก / ลบสถานที่
    function toggleSaveCurrent() {
      if (!currentPlace) return;
      const idx = savedIds.indexOf(currentPlace.id);
      if (idx > -1) {
        savedIds.splice(idx, 1);
      } else {
        savedIds.push(currentPlace.id);
      }
      updateFavBtn();
    }

    function updateFavBtn() {
      const btn = document.getElementById('btn-toggle-fav');
      if (savedIds.includes(currentPlace.id)) {
        btn.textContent = '💔 ลบรายการนี้';
        btn.style.background = '#fef2f2';
      } else {
        btn.textContent = '❤️ บันทึกสถานที่';
        btn.style.background = '#e0f2fe';
        btn.style.color = '#0284c7';
        btn.style.borderColor = '#7dd3fc';
      }
    }

    // สุ่มสถานที่
    function spinRandom() {
      const selectedType = document.querySelector('#rand-type-group .btn-option.active').dataset.type;
      const selectedProv = document.querySelector('#rand-prov-group .btn-option.active').dataset.prov;

      let filtered = places.filter(p => {
        let matchType = (selectedType === 'all' || p.type === selectedType);
        let matchProv = (selectedProv === 'all' || p.province === selectedProv);
        return matchType && matchProv;
      });

      if (filtered.length === 0) {
        alert('ไม่พบสถานที่ตรงเงื่อนไข ลองเปลี่ยนตัวเลือกดูน้า!');
        return;
      }

      const randomPlace = filtered[Math.floor(Math.random() * filtered.length)];
      openDetail(randomPlace);
    }

    // แสดงรายการหน้าสำรวจ
    function renderExploreList() {
      const selProv = document.querySelector('#exp-prov-group .btn-option.active')?.dataset.prov || 'ชลบุรี';
      const selType = document.querySelector('#exp-type-group .btn-option.active')?.dataset.type || 'all';

      const container = document.getElementById('explore-list');
      container.innerHTML = '';

      let filtered = places.filter(p => {
        let matchProv = (p.province === selProv);
        let matchType = (selType === 'all' || p.type === selType);
        return matchProv && matchType;
      });

      if(filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">ไม่พบสถานที่ในหมวดนี้</div>';
        return;
      }

      filtered.forEach(p => {
        const item = document.createElement('div');
        item.className = 'place-item-card';
        item.onclick = () => openDetail(p);
        item.innerHTML = `
          <img src="${p.img}" class="place-item-img">
          <div class="place-item-info">
            <div class="place-item-sub">📍 ${p.province}</div>
            <div class="place-item-title">${p.title}</div>
            <div class="rating-stars">${p.rating}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // แสดงรายการที่บันทึกไว้
    function renderSavedList() {
      const container = document.getElementById('saved-list');
      container.innerHTML = '';

      let savedPlaces = places.filter(p => savedIds.includes(p.id));

      if (savedPlaces.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">ยังไม่มีสถานที่ที่บันทึกไว้ ❤️</div>';
        return;
      }

      savedPlaces.forEach(p => {
        const item = document.createElement('div');
        item.className = 'place-item-card';
        item.onclick = () => openDetail(p);
        item.innerHTML = `
          <img src="${p.img}" class="place-item-img">
          <div class="place-item-info">
            <div class="place-item-sub">📍 ${p.province}</div>
            <div class="place-item-title">${p.title}</div>
            <div class="rating-stars">${p.rating}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // ผูก Event ปุ่มกดต่าง ๆ
    document.querySelectorAll('.filter-grid').forEach(grid => {
      grid.addEventListener('click', (e) => {
        if(e.target.classList.contains('btn-option')) {
          grid.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          if(grid.id.startsWith('exp-')) renderExploreList();
        }
      });
    });
  </script>
</body>
</html>
